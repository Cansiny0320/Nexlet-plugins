<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片批处理</title><link rel="stylesheet" href="main.css"></head><body><main><header><h1>图片批处理</h1><button id="add">添加图片</button></header><ol id="files"></ol>
<div class="controls"><label>操作<select id="operation"><option value="batch">批量处理</option><option value="collage">拼图</option></select></label><label>格式<select id="format"><option value="webp">WebP</option><option value="jpeg">JPEG</option><option value="png">PNG</option></select></label><label>质量<input id="quality" type="number" min="10" max="100" value="80"></label><label>最大宽度<input id="width" type="number" min="0" max="20000" value="1920"></label><label>最大高度<input id="height" type="number" min="0" max="20000" value="1920"></label><label>水印<input id="watermark" maxlength="200" placeholder="可选"></label></div>
<details><summary>拼图布局</summary><div class="controls"><label>列数<input id="columns" type="number" min="1" max="10" value="2"></label><label>单元格像素<input id="cell" type="number" min="32" max="4000" value="640"></label><label>间距<input id="gap" type="number" min="0" max="200" value="12"></label></div></details>
<div class="controls"><button id="run" class="primary">处理并保存</button><button id="cancel" hidden>取消</button><button id="preview">预览第一张</button></div><progress id="progress" max="1" value="0" hidden></progress><p id="status" role="status"></p><div class="preview" id="preview-images"></div><div id="outputs" class="output"></div></main><script src="main.js"></script></body></html>
