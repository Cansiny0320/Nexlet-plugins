<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="翻译 · Nexlet">翻译 · Nexlet</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header class="topbar"><div class="identity"><span class="mark" aria-hidden="true">文<span>A</span></span><div><h1><span data-i18n="翻译">翻译</span></h1><p><span data-i18n="让文字跨越语言">让文字跨越语言</span></p></div></div><button id="settings-toggle" class="quiet" aria-expanded="false" aria-controls="settings"><span data-i18n="翻译设置">翻译设置</span></button></header>
  <section id="settings" class="settings" hidden aria-label="翻译设置" data-i18n-aria-label="翻译设置">
    <div class="settings-heading"><h2><span data-i18n="LLM 服务">LLM 服务</span></h2><span>OpenAI-compatible</span></div>
    <label>Base URL<input id="base-url" type="url" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false"></label>
    <div class="settings-row"><label><span data-i18n="模型名">模型名</span><input id="model" placeholder="填写服务支持的模型名" data-i18n-placeholder="填写服务支持的模型名" autocomplete="off" spellcheck="false"></label><label>API Key<input id="api-key" type="password" placeholder="本地免认证服务可留空" data-i18n-placeholder="本地免认证服务可留空" autocomplete="off" spellcheck="false"></label></div>
    <p class="help"><span data-i18n="Key 加密保存在本机；系统加密不可用时仅本次会话使用。原文和译文不保存为历史。">Key 加密保存在本机；系统加密不可用时仅本次会话使用。原文和译文不保存为历史。</span></p>
    <div class="settings-actions"><button id="save-settings" class="primary"><span data-i18n="保存设置">保存设置</span></button><button id="clear-key" class="quiet"><span data-i18n="清除 Key">清除 Key</span></button></div>
    <p id="settings-status" role="status"></p>
  </section>
  <div class="engine-row"><div class="segmented" role="group" aria-label="翻译引擎" data-i18n-aria-label="翻译引擎"><button id="engine-google" aria-pressed="true" data-engine="google">Google <small><span data-i18n="免 Key">免 Key</span></small></button><button id="engine-llm" aria-pressed="false" data-engine="llm">LLM <small><span data-i18n="自选模型">自选模型</span></small></button></div><span id="engine-note"><span data-i18n="Google 网页接口">Google 网页接口</span></span></div>
  <section class="workspace" aria-label="翻译工作区" data-i18n-aria-label="翻译工作区">
    <div class="text-panel source-panel"><div class="panel-heading"><label for="source"><span data-i18n="原文">原文</span></label><select id="source" aria-label="源语言" data-i18n-aria-label="源语言"></select></div><textarea id="input" aria-label="原文" data-i18n-aria-label="原文" placeholder="输入或从启动器带入文字…" data-i18n-placeholder="输入或从启动器带入文字…" spellcheck="false"></textarea><div class="panel-footer"><span id="count">0 / 5000</span><button id="clear-input" class="text-button"><span data-i18n="清空">清空</span></button></div></div>
    <div class="text-panel target-panel"><div class="panel-heading"><label for="target"><span data-i18n="译文">译文</span></label><select id="target" aria-label="目标语言" data-i18n-aria-label="目标语言"></select></div><textarea id="output" aria-label="译文" data-i18n-aria-label="译文" readonly placeholder="译文会显示在这里" data-i18n-placeholder="译文会显示在这里"></textarea><div class="panel-footer"><span id="detected"></span><button id="copy" class="text-button" disabled><span data-i18n="复制译文">复制译文</span></button></div></div>
  </section>
  <footer class="actions"><div class="status-area"><p id="status" role="status" aria-live="polite"><span data-i18n="准备就绪">准备就绪</span></p><span id="shortcut"><span data-i18n="⌘ / Ctrl + Enter 翻译">⌘ / Ctrl + Enter 翻译</span></span></div><div class="action-buttons"><button id="cancel" class="quiet" hidden><span data-i18n="取消">取消</span></button><button id="translate" class="primary" disabled><span data-i18n="开始翻译">开始翻译 </span><span aria-hidden="true">↗</span></button></div></footer>
  <p class="privacy"><span data-i18n="Google 输入后自动发送文字翻译，LLM 点击后发送。Google 免 Key 接口可能限流或不可用。">Google 输入后自动发送文字翻译，LLM 点击后发送。Google 免 Key 接口可能限流或不可用。</span></p>
</main>
<script type="module" src="main.js"></script>
</body></html>
