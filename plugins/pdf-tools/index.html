<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 工具</title><link rel="stylesheet" href="main.css"></head><body><main>
<header><h1>PDF 工具</h1><button id="add">添加文件</button></header><ol id="files"></ol>
<div class="controls"><label>操作<select id="operation"><option value="merge">合并 PDF</option><option value="extract">提取／重排页面</option><option value="split">拆分为单页</option><option value="rotate">旋转页面</option><option value="images">图片转 PDF</option><option value="render">PDF 转 PNG</option></select></label><label>页码<input id="pages" placeholder="全部；或 1-3,5,2" maxlength="4000"></label><label>旋转<select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><label>渲染比例<select id="scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label></div>
<div class="controls"><button id="run" class="primary">处理并保存</button><button id="cancel" hidden>取消</button><button id="preview">预览第一页</button></div><progress id="progress" value="0" max="1" hidden></progress><p id="status" role="status"></p><div id="preview-images" class="preview"></div><div id="outputs" class="output"></div>
</main><script src="main.js"></script></body></html>
