<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI actions</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1 data-t="title">AI 动作</h1><p data-t="subtitle"></p></div><button id="new" data-t="new"></button></header>
<main><aside><nav id="list"></nav><details><summary>Prompt / Model / API</summary><label><span data-t="name"></span><input id="name" maxlength="80"></label><label>Prompt<textarea id="prompt" maxlength="20000"></textarea></label><label><span data-t="model"></span><input id="model" maxlength="200"></label><label>Base URL<input id="baseUrl" type="url"></label><label><span data-t="key"></span><input id="apiKey" type="password" autocomplete="off"></label><div class="actions"><button id="save" data-t="save"></button><button id="remove" data-t="remove"></button><button id="clearKey" data-t="clearKey"></button></div></details></aside>
<section><label for="input" data-t="input"></label><textarea id="input" maxlength="100000" spellcheck="false"></textarea><div class="actions"><button id="run" class="primary" data-t="run"></button><button id="stop" data-t="stop" hidden></button></div><label for="output" data-t="output"></label><textarea id="output" readonly></textarea><div class="actions"><button id="copy" data-t="copy"></button><button id="paste" data-t="paste"></button><button id="continue" data-t="continue"></button></div></section></main>
<footer><p id="status" role="status"></p><small data-t="privacy"></small></footer><script src="main.js"></script></body></html>
