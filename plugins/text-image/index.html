<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字表格转图片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="heading"><img class="icon" src="icon.png" alt=""><div><h1 data-i18n="title">文字表格转图片</h1><p data-i18n="subtitle">复制、预览，把内容变成一张清晰的图片。</p></div></div>
      <div class="actions"><button id="read" data-i18n="read">读取剪贴板</button><button id="copy" class="primary" data-i18n="copy" disabled>复制图片</button><button id="save" data-i18n="save" disabled>保存 PNG</button></div>
    </header>
    <div id="compatibility" class="notice" hidden></div>
    <div class="workspace">
      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="section-heading"><h2 id="preview-title" data-i18n="preview">图片预览</h2><span id="mode" class="badge">文字</span></div>
        <div class="stage" tabindex="0">
          <div id="empty"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="7" y="7" width="34" height="34" rx="6" stroke="currentColor" stroke-width="1.5"/><path d="M15 17h18M15 24h12M15 31h7m9-5v10m-5-5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><p data-i18n="empty">复制文字或 Excel 单元格，然后读取剪贴板。</p><span data-i18n="emptyHint">也可以直接粘贴到这里</span></div>
          <img id="preview" alt="图片预览" hidden>
        </div>
        <div class="preview-meta"><span id="dimensions"></span><span data-i18n="quality">以 2 倍像素导出 PNG</span></div>
      </section>
      <aside>
        <h2 data-i18n="layout">排版设置</h2>
        <label for="width"><span data-i18n="width">图片宽度</span><span class="input-unit"><input id="width" type="number" value="800" min="240" max="4096" step="40"><span>px</span></span></label>
        <label for="font-size"><span data-i18n="fontSize">字号</span><span class="input-unit"><input id="font-size" type="number" value="16" min="10" max="48"><span>px</span></span></label>
        <label for="padding"><span data-i18n="padding">内边距</span><span class="input-unit"><input id="padding" type="number" value="24" min="0" max="96" step="4"><span>px</span></span></label>
        <label for="background"><span data-i18n="background">背景颜色</span><input id="background" type="color" value="#ffffff"></label>
        <div id="editor"><label for="text" class="editor-label" data-i18n="editor">编辑文字</label><textarea id="text" spellcheck="false" placeholder="在这里输入文字，或粘贴 Excel 单元格…"></textarea></div>
        <div id="table-info" hidden><strong id="table-size"></strong><p id="table-hint"></p></div>
      </aside>
    </div>
    <footer><span id="status" role="status" aria-live="polite"></span><span class="privacy" data-i18n="local">本地处理 · 内容不保存</span></footer>
  </main>
  <script src="main.js"></script>
</body>
</html>
