name: Validate and release plugins
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Test plugins
        run: npm test
      - name: Typecheck and build plugins
        run: npm run build
      - name: Validate and package Ctool
        run: |
          npm run test:ctool
          python3 scripts/package.py --plugin-dir .build/plugins/ctool --output dist/ctool.nexlet
      - name: Package TypeScript example
        run: python3 scripts/package.py --plugin-dir .build/templates/typescript --output dist-examples/typescript-example.nexlet
      - name: Validate and package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package.py --source-root .build/plugins ${RELEASE_TAG:+"$RELEASE_TAG"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nexlet-plugins
          path: dist/*.nexlet
      - name: Publish tagged plugin release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.nexlet --verify-tag --title "Nexlet plugins $RELEASE_TAG" --generate-notes
