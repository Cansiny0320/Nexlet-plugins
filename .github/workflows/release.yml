name: Validate and release plugins
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Never interrupt an upload; stale snapshots are rejected before index writes.
concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build dependencies
        run: npm ci
      - name: Test plugins and publishing safeguards
        run: npm test
      - name: Typecheck and build plugins
        run: npm run build
      - name: Validate Ctool
        run: npm run test:ctool
      - name: Package TypeScript example
        run: python3 scripts/package.py --plugin-dir .build/templates/typescript --output dist-examples/typescript-example.nexlet
      - name: Prepare candidate catalog and packages
        run: |
          npm run publish:preview
          python3 scripts/package.py --source-root .build/plugins --index dist/index.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nexlet-plugins
          include-hidden-files: true
          path: |
            dist/*.nexlet
            .build/plugins/*/plugin.json
            .build/plugins/*/*.png
  publish:
    needs: package
    if: github.repository == 'Cansiny0320/Nexlet-plugins' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download validated packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name nexlet-plugins --dir .
      - name: Publish immutable assets then update marketplace
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs --publish
