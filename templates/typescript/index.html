<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeScript 便笺</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <h1>TypeScript 便笺</h1>
    <p>写下一段文字，或从启动器带入文本。</p>
    <label for="note">便笺内容</label>
    <textarea id="note" rows="10" placeholder="从这里开始…"></textarea>
    <div class="actions">
      <button id="save" type="button">保存</button>
      <button id="copy" type="button">复制</button>
      <span id="status" role="status" aria-live="polite">加载中…</span>
    </div>
  </main>
</body>
</html>
